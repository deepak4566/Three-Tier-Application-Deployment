# ==============================================================================
# NGINX Ingress Controller Routing & Edge Security Manifest (Backward Compatible)
# ==============================================================================
# This manifest provides a backward-compatible alias for 'ingress-nginx.yaml'.
# Routes external HTTP requests entering through the AWS NLB to backend and frontend.
#
# Routing Rules:
# - Path '/'        -> Routes to React 'frontend' Service (port 3000)
# - Path '/api'     -> Routes to Node.js 'backend' REST API Service (port 8080)
# - Path '/ok'      -> Routes to Node.js 'backend' health endpoint (port 8080)
# ==============================================================================

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: three-tier-ingress
  namespace: workshop
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"

    # Buffer & Timeout Limits
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "15"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"

    # Rate Limiting & Connection Throttling
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-connections: "50"

    # Injected Security Response Headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: SAMEORIGIN";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /ok
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
