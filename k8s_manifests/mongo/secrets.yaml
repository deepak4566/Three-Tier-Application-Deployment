# ==============================================================================
# MongoDB Bootstrap / Local Fallback Kubernetes Secret
# ==============================================================================
# In production on AWS EKS:
# - The AWS Secrets Store CSI Driver ('SecretProviderClass') automatically retrieves
#   the secret from AWS Secrets Manager ('workshop/mongo-sec') and dynamically populates
#   this Kubernetes Secret ('mongo-sec').
#
# For Local Testing / Initial Bootstrap:
# - If you deploy manifests before setting up the AWS Secrets Store CSI Driver,
#   you can apply this manifest directly so the Backend and MongoDB pods have credentials.
#
# Base64 Decoded Values:
# - username: admin       (YWRtaW4=)
# - password: password123 (cGFzc3dvcmQxMjM=)
# ==============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: mongo-sec
  namespace: workshop
type: Opaque
data:
  username: YWRtaW4=         # Base64 for 'admin'
  password: cGFzc3dvcmQxMjM= # Base64 for 'password123'