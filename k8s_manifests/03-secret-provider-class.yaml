# ==============================================================================
# AWS Secrets Store CSI Driver: SecretProviderClass Manifest
# ==============================================================================
# This resource configures the AWS Secrets and Configuration Provider (ASCP) for
# the Kubernetes Secrets Store CSI Driver.
#
# Execution Flow:
# 1. When a Pod mounting the CSI volume starts, the driver contacts AWS Secrets Manager
#    to retrieve the secret named 'workshop/mongo-sec'.
# 2. 'jmesPath' parses the JSON payload to extract 'username' and 'password'.
# 3. 'secretObjects' synchronizes these values into a standard native Kubernetes Secret
#    named 'mongo-sec' in the 'workshop' namespace.
# 4. Containers can then consume credentials either from mounted files (/mnt/secrets-store)
#    OR via environment variables using standard 'secretKeyRef' references.
# ==============================================================================

apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: aws-secrets-provider
  namespace: workshop
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "workshop/mongo-sec" # Secret name stored in AWS Secrets Manager
        objectType: "secretsmanager"
        jmesPath:
          - path: username              # Extract 'username' key from the JSON payload
            objectAlias: username
          - path: password              # Extract 'password' key from the JSON payload
            objectAlias: password

  # Automatically synchronize the retrieved secrets into a native Kubernetes Secret
  secretObjects:
    - secretName: mongo-sec             # Name of the k8s Secret to create/update
      type: Opaque
      data:
        - objectName: username          # References the objectAlias defined above
          key: username                 # Key in the resulting k8s Secret
        - objectName: password
          key: password
