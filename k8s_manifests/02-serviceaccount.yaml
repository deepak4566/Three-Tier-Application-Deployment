# ==============================================================================
# Kubernetes ServiceAccount with IAM Roles for Service Accounts (IRSA)
# ==============================================================================
# This ServiceAccount is attached to Pods (e.g., Backend, MongoDB) requiring secure
# access to AWS services (specifically AWS Secrets Manager via Secrets Store CSI).
#
# How IRSA Works:
# 1. The 'eks.amazonaws.com/role-arn' annotation associates this k8s identity with
#    an AWS IAM Role ('workshop-secrets-store-role').
# 2. When a Pod starts, the EKS Pod Identity Webhook injects an OIDC token and
#    environment variables (AWS_ROLE_ARN, AWS_WEB_IDENTITY_TOKEN_FILE).
# 3. The Secrets Store CSI Driver uses this temporary projected token to assume
#    the IAM Role and fetch credentials from AWS Secrets Manager securely.
# ==============================================================================

apiVersion: v1
kind: ServiceAccount
metadata:
  name: workshop-sa
  namespace: workshop
  annotations:
    # Replace <AWS_ACCOUNT_ID> with your AWS Account ID or the ARN output from Terraform
    eks.amazonaws.com/role-arn: arn:aws:iam::254209145424:role/workshop-secrets-store-role
